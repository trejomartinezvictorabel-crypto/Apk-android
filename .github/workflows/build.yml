name: WebScout Universal - Compilar APK

# ÚNICO archivo que debes crear a mano en GitHub:  .github/workflows/build.yml
# Después sube el ZIP del proyecto a la RAÍZ del repositorio: el workflow lo descomprime,
# valida y repara el proyecto, compila y firma el APK.
#
# Ejecución manual (Actions -> este workflow -> Run workflow) con la opción "accion":
#   compilar          -> compila y firma el APK
#   generar_keystore  -> crea UNA sola vez el keystore (Base64) para copiarlo a los Secrets

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer'
        type: choice
        options: [compilar, generar_keystore]
        default: compilar
      key_alias:
        description: 'Solo generar_keystore: alias de la clave'
        required: false
        default: 'webscout'
      validity_days:
        description: 'Solo generar_keystore: validez en días'
        required: false
        default: '10000'

concurrency:
  group: webscout-${{ github.ref }}-${{ github.event.inputs.accion || 'push' }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  build:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.accion == 'compilar'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Descomprime el .zip de la raíz SIN anidar carpetas: busca el pubspec.yaml más superficial
      #    dentro del zip y copia desde ESA carpeta a la raíz del repo.
      - name: Descomprimir ZIP del proyecto (si existe)
        run: |
          shopt -s nullglob
          ZIPS=(./*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No hay .zip en la raíz: se usa el repositorio tal cual."
          else
            for Z in "${ZIPS[@]}"; do
              echo "Descomprimiendo $Z"
              rm -rf /tmp/unz && mkdir -p /tmp/unz
              unzip -q -o "$Z" -d /tmp/unz
              P=$(find /tmp/unz -maxdepth 4 -name pubspec.yaml -not -path '*/__MACOSX/*' \
                  | awk '{ print gsub("/","/"), $0 }' | sort -n | head -1 | cut -d' ' -f2-)
              if [ -z "$P" ]; then
                echo "::error::El zip $Z no contiene pubspec.yaml"; exit 1
              fi
              SRC=$(dirname "$P")
              echo "Raíz del proyecto dentro del zip: ${SRC#/tmp/unz}"
              if command -v rsync >/dev/null 2>&1; then
                rsync -a --exclude='.git/' --exclude='__MACOSX/' --exclude='*.zip' "$SRC"/ ./
              else
                cp -a "$SRC"/. ./
              fi
            done
          fi
          test -f pubspec.yaml || { echo "::error::pubspec.yaml no está en la raíz del repo"; exit 1; }
          test -f lib/main.dart || { echo "::error::lib/main.dart no está en la raíz del repo"; exit 1; }
          echo "Estructura en la raíz:"; ls -la

      # Crea tools/validate_project.py si no viene en el ZIP
      - name: Preparar validador en Python (tools/validate_project.py)
        run: |
          if [ ! -f tools/validate_project.py ]; then
            mkdir -p tools
            cat <<'EOF' > tools/validate_project.py
          #!/usr/bin/env python3
          import argparse
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          KNOWN = {
              'crypto': '^3.0.6',
              'flutter_tts': '^4.2.5',
              'html': '^0.15.4',
              'permission_handler': '^11.3.1',
              'shared_preferences': '^2.3.3',
              'speech_to_text': '^7.0.0',
              'webview_flutter': '^4.10.0',
              'http': '^1.2.2',
              'path_provider': '^2.1.5',
              'url_launcher': '^6.3.1',
              'file_picker': '^8.1.6',
          }
          SDK_PKGS = {'flutter', 'flutter_test', 'flutter_localizations', 'flutter_web_plugins', 'integration_test'}

          REQUIRED_SOURCES = [
              'lib/main.dart',
              'lib/parental/parental.dart', 'lib/parental/age_profile.dart', 'lib/parental/mini_http.dart',
              'lib/parental/parental_controller.dart', 'lib/parental/safe_filter.dart',
              'lib/parental/study_builder.dart', 'lib/parental/parental_ui.dart',
              'lib/shield/shield.dart', 'lib/shield/bloom_filter.dart', 'lib/shield/shield_engine.dart',
              'lib/shield/shield_lists.dart', 'lib/shield/shield_rules.dart', 'lib/shield/shield_types.dart',
              'lib/shield/shield_ui.dart',
          ]

          RESTORABLE = [
              'android/app/build.gradle.kts',
              'android/app/src/main/res/drawable/ic_launcher_foreground.xml',
              'android/app/src/main/res/drawable/launch_background.xml',
              'android/app/src/main/res/drawable-v21/launch_background.xml',
              'android/app/src/main/res/values/ic_launcher_background.xml',
              'android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml',
              'android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml',
          ]

          PERMISSIONS = ['INTERNET', 'ACCESS_NETWORK_STATE', 'POST_NOTIFICATIONS', 'RECORD_AUDIO']
          QUERIES = {
              'android.speech.RecognitionService': '        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n',
              'android.intent.action.TTS_SERVICE': '        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n',
          }
          APP_ID = 'com.webscout.universal'


          class Report:
              def __init__(self):
                  self.rows = []

              def add(self, status, title, detail=''):
                  self.rows.append((status, title, detail))
                  icon = {'OK': '✅', 'FIXED': '🛠️', 'WARN': '⚠️', 'ERROR': '❌'}[status]
                  print(f'{icon} [{status}] {title}' + (f' — {detail}' if detail else ''))

              @property
              def errors(self):
                  return sum(1 for r in self.rows if r[0] == 'ERROR')

              def markdown(self):
                  lines = ['## Validación del proyecto', '', '| Estado | Comprobación | Detalle |', '|---|---|---|']
                  for s, t, d in self.rows:
                      lines.append(f'| {s} | {t} | {d.replace("|", "/")} |')
                  lines.append('')
                  lines.append(f'Errores sin reparar: **{self.errors}**')
                  return '\n'.join(lines) + '\n'


          def read(p: Path) -> str:
              return p.read_text(encoding='utf-8', errors='replace')


          def write(p: Path, s: str):
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(s, encoding='utf-8')


          def restore(root: Path, rel: str, rep: Report, why: str) -> bool:
              src = root / 'tools' / 'templates' / rel
              dst = root / rel
              if not src.exists():
                  return False
              if dst.exists():
                  shutil.copy2(dst, str(dst) + '.bak')
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              rep.add('FIXED', f'Restaurado {rel}', why)
              return True


          def check_required(root: Path, rep: Report, fix: bool):
              missing = []
              for rel in REQUIRED_SOURCES:
                  if not (root / rel).exists():
                      missing.append(rel)
              if missing:
                  for m in missing:
                      rep.add('ERROR', f'Falta {m}', 'Archivo de código obligatorio: vuelve a subir el ZIP completo del proyecto.')
              else:
                  rep.add('OK', 'Archivos Dart obligatorios', f'{len(REQUIRED_SOURCES)} presentes')
              for rel in RESTORABLE:
                  if not (root / rel).exists():
                      if fix and restore(root, rel, rep, 'faltaba en el ZIP'):
                          continue
                      rep.add('ERROR', f'Falta {rel}', 'No hay plantilla de respaldo.')
              if not (root / 'pubspec.yaml').exists():
                  rep.add('ERROR', 'Falta pubspec.yaml')
              if not (root / '.github' / 'workflows' / 'build.yml').exists():
                  rep.add('WARN', 'No está .github/workflows/build.yml', 'Debe estar confirmado (commit) en el repositorio para que GitHub lo ejecute.')


          def dart_files(root: Path):
              return sorted((root / 'lib').rglob('*.dart')) if (root / 'lib').exists() else []


          def imported_packages(root: Path):
              pk = set()
              rx = re.compile(r'''^\s*(?:import|export)\s+['"]package:([A-Za-z0-9_]+)/''', re.M)
              for f in dart_files(root):
                  pk.update(rx.findall(read(f)))
              return pk


          def deps_block(lines):
              start = None
              for i, l in enumerate(lines):
                  if re.match(r'^dependencies:\s*$', l):
                      start = i
                      break
              if start is None:
                  return None, set()
              names = set()
              for l in lines[start + 1:]:
                  if l.strip() and not l.startswith((' ', '\t', '#')):
                      break
                  m = re.match(r'^  ([A-Za-z0-9_]+):', l)
                  if m:
                      names.add(m.group(1))
              return start, names


          def check_pubspec(root: Path, rep: Report, fix: bool):
              p = root / 'pubspec.yaml'
              if not p.exists():
                  return
              text = read(p)
              changed = False

              if not re.search(r'(?m)^name:\s*\S+', text):
                  text = 'name: webscout_universal\n' + text
                  changed = True
                  rep.add('FIXED', 'pubspec: faltaba name', 'name: webscout_universal')
              own = re.search(r'(?m)^name:\s*(\S+)', text).group(1)

              m = re.search(r'(?m)^version:\s*(\S+)\s*$', text)
              if not m:
                  text = re.sub(r'(?m)^(name:\s*\S+\s*)$', r'\1\nversion: 1.0.0+1', text, count=1)
                  changed = True
                  rep.add('FIXED', 'pubspec: faltaba version', 'version: 1.0.0+1')
              else:
                  v = m.group(1)
                  if re.fullmatch(r'\d+\.\d+\.\d+\+\d+', v):
                      rep.add('OK', 'pubspec: version', f'{v} (el número tras "+" es el versionCode)')
                  elif re.fullmatch(r'\d+\.\d+\.\d+', v):
                      text = re.sub(r'(?m)^version:\s*' + re.escape(v) + r'\s*$', f'version: {v}+1', text, count=1)
                      changed = True
                      rep.add('FIXED', 'pubspec: version sin versionCode', f'{v} -> {v}+1')
                  else:
                      rep.add('ERROR', 'pubspec: version inválida', f'"{v}" debe ser x.y.z+n')

              if not re.search(r'(?m)^environment:', text):
                  text = text.rstrip('\n') + "\n\nenvironment:\n  sdk: '>=3.4.0 <4.0.0'\n"
                  changed = True
                  rep.add('FIXED', 'pubspec: faltaba environment')

              lines = text.split('\n')
              start, names = deps_block(lines)
              if start is None:
                  lines += ['', 'dependencies:', '  flutter:', '    sdk: flutter']
                  text = '\n'.join(lines)
                  lines = text.split('\n')
                  start, names = deps_block(lines)
                  changed = True
                  rep.add('FIXED', 'pubspec: faltaba dependencies')
              inject = []
              if 'flutter' not in names:
                  inject += ['  flutter:', '    sdk: flutter']
                  rep.add('FIXED', 'pubspec: faltaba el SDK de flutter')
              needed = imported_packages(root) - SDK_PKGS - {own}
              for pkg in sorted(needed - names):
                  ver = KNOWN.get(pkg)
                  if ver:
                      inject.append(f'  {pkg}: {ver}')
                      rep.add('FIXED', f'Dependencia inyectada: {pkg}', f'el código la importa y faltaba en pubspec ({ver})')
                  else:
                      inject.append(f'  {pkg}: any')
                      rep.add('WARN', f'Dependencia inyectada sin versión conocida: {pkg}', 'se usó "any"; si no existe en pub.dev el build fallará')
              if not needed - names:
                  rep.add('OK', 'pubspec: dependencias vs imports', f'{len(needed)} paquetes de terceros declarados')
              if inject:
                  lines[start + 1:start + 1] = inject
                  text = '\n'.join(lines)
                  changed = True

              if not re.search(r'(?m)^flutter:\s*$', text):
                  text = text.rstrip('\n') + '\n\nflutter:\n  uses-material-design: true\n'
                  changed = True
                  rep.add('FIXED', 'pubspec: faltaba sección flutter')
              elif 'uses-material-design' not in text:
                  text = re.sub(r'(?m)^flutter:\s*$', 'flutter:\n  uses-material-design: true', text, count=1)
                  changed = True
                  rep.add('FIXED', 'pubspec: uses-material-design')

              if changed:
                  if fix:
                      shutil.copy2(p, str(p) + '.bak')
                      write(p, text if text.endswith('\n') else text + '\n')
                  else:
                      rep.add('WARN', 'pubspec: hay correcciones pendientes (ejecuta con --fix)')


          def check_manifest(root: Path, rep: Report, fix: bool):
              p = root / 'android/app/src/main/AndroidManifest.xml'
              if not p.exists():
                  rep.add('ERROR', 'Falta AndroidManifest.xml')
                  return
              s = read(p)
              changed = False
              for perm in PERMISSIONS:
                  if f'android.permission.{perm}' not in s:
                      m = re.search(r'<manifest[^>]*>', s)
                      if not m:
                          rep.add('ERROR', 'AndroidManifest.xml sin etiqueta <manifest>')
                          return
                      line = f'\n    <uses-permission android:name="android.permission.{perm}" />'
                      s = s[:m.end()] + line + s[m.end():]
                      changed = True
                      rep.add('FIXED', f'Permiso inyectado: {perm}')
              if '<queries>' not in s:
                  block = '\n    <queries>\n' + ''.join(QUERIES.values()) + '    </queries>\n'
                  s = s.replace('</manifest>', block + '</manifest>')
                  changed = True
                  rep.add('FIXED', 'Inyectado <queries> (voz y TTS)')
              else:
                  for key, frag in QUERIES.items():
                      if key not in s:
                          s = s.replace('</queries>', frag + '    </queries>')
                          changed = True
                          rep.add('FIXED', f'Inyectado query: {key}')
              if 'android.intent.action.SEND' not in s and '</activity>' in s:
                  send = ('            <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n'
                          '                <category android:name="android.intent.category.DEFAULT" />\n'
                          '                <data android:mimeType="text/plain" />\n            </intent-filter>\n')
                  s = s.replace('</activity>', send + '        </activity>', 1)
                  changed = True
                  rep.add('FIXED', 'Inyectado intent-filter de "Compartir" (SEND text/plain)')
              if 'flutterEmbedding' not in s:
                  s = s.replace('</application>', '        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>')
                  changed = True
                  rep.add('FIXED', 'Inyectado flutterEmbedding=2')
              if 'android:exported' not in s:
                  rep.add('ERROR', 'La activity no declara android:exported', 'Obligatorio con targetSdk 31+.')
              if changed:
                  if fix:
                      shutil.copy2(p, str(p) + '.bak')
                      write(p, s)
              else:
                  rep.add('OK', 'AndroidManifest.xml', 'permisos y queries presentes')


          def check_gradle(root: Path, rep: Report, fix: bool):
              g = root / 'android/app/build.gradle.kts'
              markers = [APP_ID, 'hasReleaseSigning', 'signingConfigs', 'flutter {']
              ok = g.exists() and all(m in read(g) for m in markers)
              if not ok:
                  if fix and restore(root, 'android/app/build.gradle.kts', rep, 'faltaba o no tenía la firma release fija'):
                      pass
                  else:
                      rep.add('ERROR', 'build.gradle.kts sin firma release fija')
              else:
                  rep.add('OK', 'build.gradle.kts', f'applicationId {APP_ID} + firma release')
              groovy = root / 'android/app/build.gradle'
              if groovy.exists() and (root / 'android/app/build.gradle.kts').exists():
                  if fix:
                      shutil.move(str(groovy), str(groovy) + '.bak')
                      rep.add('FIXED', 'Eliminado android/app/build.gradle duplicado', 'convive con build.gradle.kts y causa ambigüedad')
                  else:
                      rep.add('WARN', 'Existen build.gradle y build.gradle.kts a la vez')


          def prune_empty(d: Path, stop: Path):
              while d != stop and d.exists() and d.is_dir() and not any(d.iterdir()):
                  d.rmdir()
                  d = d.parent


          def check_package(root: Path, rep: Report, fix: bool):
              g = root / 'android/app/build.gradle.kts'
              if not g.exists():
                  return
              gs = read(g)
              ns = re.search(r'namespace\s*=\s*"([^"]+)"', gs)
              aid = re.search(r'applicationId\s*=\s*"([^"]+)"', gs)
              if not ns or not aid:
                  rep.add('ERROR', 'Gradle sin namespace o applicationId')
                  return
              ns, aid = ns.group(1), aid.group(1)
              if aid != APP_ID:
                  rep.add('WARN', 'applicationId distinto del fijo', f'{aid} != {APP_ID}: no podrá actualizar la app ya instalada')
              kroot = root / 'android/app/src/main/kotlin'
              acts = sorted(kroot.rglob('MainActivity.kt')) if kroot.exists() else []
              if not acts:
                  rep.add('ERROR', 'Falta MainActivity.kt', 'Contiene el puente nativo (descargas, SAF); no se puede regenerar.')
                  return
              good = None
              for a in acts:
                  pk = re.search(r'(?m)^package\s+([\w.]+)', read(a))
                  if pk and pk.group(1) == ns and a.parent == kroot.joinpath(*ns.split('.')):
                      good = a
              if good is None:
                  a = acts[0]
                  src = read(a)
                  src = re.sub(r'(?m)^package\s+[\w.]+', f'package {ns}', src, count=1)
                  dst = kroot.joinpath(*ns.split('.')) / 'MainActivity.kt'
                  if fix:
                      write(dst, src)
                      if a != dst:
                          a.unlink()
                          prune_empty(a.parent, kroot)
                      rep.add('FIXED', 'MainActivity.kt alineada con el namespace', f'package {ns}')
                      good = dst
                  else:
                      rep.add('WARN', 'MainActivity.kt no coincide con el namespace')
              else:
                  rep.add('OK', 'Paquete', f'namespace = applicationId = MainActivity = {ns}')
              for a in acts:
                  if good is not None and a != good and a.exists() and fix:
                      a.unlink()
                      prune_empty(a.parent, kroot)
                      rep.add('FIXED', 'Eliminada MainActivity duplicada', str(a.relative_to(root)))
              if good is not None and 'webscout/native' not in read(good):
                  rep.add('ERROR', 'MainActivity.kt no contiene el puente nativo', 'Falta el canal "webscout/native" (es la plantilla genérica de Flutter).')


          def strip_dart(s: str) -> str:
              s = re.sub(r"r'''.*?'''|'''.*?'''|r'[^'\n]*'|'(?:\\.|[^'\\\n])*'|\"(?:\\.|[^\"\\\n])*\"", '""', s, flags=re.S)
              s = re.sub(r'/\*.*?\*/', '', s, flags=re.S)
              return re.sub(r'//[^\n]*', '', s)


          def check_dart(root: Path, rep: Report):
              files = dart_files(root)
              if not files:
                  rep.add('ERROR', 'No hay archivos Dart en lib/')
                  return
              bad = 0
              rx = re.compile(r'''^\s*(?:import|export)\s+['"](?!package:|dart:)([^'"]+)['"]''', re.M)
              for f in files:
                  s = read(f)
                  t = strip_dart(s)
                  for a, b in ('()', '{}', '[]'):
                      if t.count(a) != t.count(b):
                          rep.add('ERROR', f'{f.relative_to(root)}: {a}{b} desbalanceados', f'{t.count(a)} vs {t.count(b)}')
                          bad += 1
                          break
                  for rel in rx.findall(s):
                      if not (f.parent / rel).resolve().exists():
                          rep.add('ERROR', f'{f.relative_to(root)}: import relativo inexistente', rel)
                          bad += 1
              main = root / 'lib/main.dart'
              if main.exists() and not re.search(r'\bvoid\s+main\s*\(', read(main)):
                  rep.add('ERROR', 'lib/main.dart sin función main()')
                  bad += 1
              if bad == 0:
                  rep.add('OK', 'Dart: sintaxis básica e imports', f'{len(files)} archivos')


          def relax(root: Path, rep: Report):
              p = root / 'pubspec.yaml'
              lines = read(p).split('\n')
              start, _ = deps_block(lines)
              if start is None:
                  rep.add('ERROR', 'Sin bloque dependencies')
                  return
              n = 0
              for i in range(start + 1, len(lines)):
                  l = lines[i]
                  if l.strip() and not l.startswith((' ', '\t', '#')):
                      break
                  m = re.match(r'^(  [A-Za-z0-9_]+):\s*([\^<>=~\d][^#\n]*?)\s*(#.*)?$', l)
                  if m and m.group(1).strip() != 'flutter':
                      lines[i] = f'{m.group(1)}: any' + (f'  {m.group(3)}' if m.group(3) else '')
                      n += 1
              shutil.copy2(p, str(p) + '.bak')
              write(p, '\n'.join(lines))
              rep.add('FIXED', 'Restricciones de versión relajadas', f'{n} dependencias -> any (para que pub get resuelva)')


          def post(root: Path, rep: Report):
              cfg = root / '.dart_tool' / 'package_config.json'
              if not cfg.exists():
                  rep.add('ERROR', 'No existe .dart_tool/package_config.json', 'flutter pub get no se ejecutó')
                  return
              have = {p['name'] for p in json.load(open(cfg, encoding='utf-8'))['packages']}
              own = re.search(r'(?m)^name:\s*(\S+)', read(root / 'pubspec.yaml')).group(1)
              missing = sorted(imported_packages(root) - SDK_PKGS - {own} - have)
              if not missing:
                  rep.add('OK', 'Paquetes resueltos', f'{len(have)} en package_config')
                  return
              for pkg in missing:
                  r = subprocess.run(['flutter', 'pub', 'add', pkg], capture_output=True, text=True)
                  if r.returncode == 0:
                      rep.add('FIXED', f'flutter pub add {pkg}', 'inyectado antes de compilar')
                  else:
                      rep.add('ERROR', f'No se pudo agregar {pkg}', (r.stderr or r.stdout)[-200:].replace('\n', ' '))


          def gradle_fallback(root: Path, rep: Report):
              g = root / 'android/app/build.gradle.kts'
              s = read(g)
              s2 = re.sub(r'(?m)^import org\.jetbrains\.kotlin\.gradle\.dsl\.JvmTarget\s*\n', '', s)
              s2 = re.sub(r'(?s)\nkotlin \{\s*compilerOptions \{.*?\}\s*\}\n', '\n', s2)
              if s2 != s:
                  shutil.copy2(g, str(g) + '.bak')
                  write(g, s2)
                  rep.add('FIXED', 'Gradle: eliminado el bloque kotlin { compilerOptions }', 'respaldo para toolchains que no lo aceptan')
              else:
                  rep.add('WARN', 'Gradle: nada que simplificar')


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--root', default='.')
              ap.add_argument('--fix', action='store_true')
              ap.add_argument('--relax', action='store_true')
              ap.add_argument('--post', action='store_true')
              ap.add_argument('--gradle-fallback', action='store_true')
              ap.add_argument('--report', default='')
              a = ap.parse_args()
              root = Path(a.root).resolve()
              rep = Report()

              if a.relax:
                  relax(root, rep)
              elif a.post:
                  post(root, rep)
              elif a.gradle_fallback:
                  gradle_fallback(root, rep)
              else:
                  check_required(root, rep, a.fix)
                  check_pubspec(root, rep, a.fix)
                  check_manifest(root, rep, a.fix)
                  check_gradle(root, rep, a.fix)
                  check_package(root, rep, a.fix)
                  check_dart(root, rep)

              md = rep.markdown()
              out = root / 'build' / 'validation-report.md'
              out.parent.mkdir(parents=True, exist_ok=True)
              with open(out, 'a', encoding='utf-8') as fh:
                  fh.write(md + '\n')
              if a.report:
                  try:
                      with open(a.report, 'a', encoding='utf-8') as fh:
                          fh.write(md + '\n')
                  except OSError:
                      pass
              sys.exit(1 if rep.errors else 0)


          if __name__ == '__main__':
              main()
          EOF
            chmod +x tools/validate_project.py
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versiones
        run: |
          flutter --version
          java -version
          python3 --version

      - name: Aceptar licencias del SDK de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      # Andamiaje Gradle estándar de Flutter SIN sobrescribir nuestros archivos.
      # org com.webscout + project-name universal => paquete com.webscout.universal
      - name: Generar andamiaje Android faltante
        run: |
          flutter create --platforms=android --org com.webscout --project-name universal /tmp/scaffold
          cp -rn /tmp/scaffold/android/. android/ || true

      # 2) VALIDADOR: comprueba el proyecto y REPARA lo reparable (inyecta dependencias, permisos,
      #    restaura firma/íconos, alinea paquetes). Falla solo si hay errores que no puede arreglar.
      - name: Validar y reparar proyecto (Python)
        run: python3 tools/validate_project.py --fix --report "$GITHUB_STEP_SUMMARY"

      # 3) Dependencias con reintento: si la resolución falla, relaja versiones y vuelve a intentar.
      - name: Dependencias (con reintento automático)
        run: |
          if ! flutter pub get; then
            echo "::warning::pub get falló; se relajan las restricciones de versión y se reintenta."
            python3 tools/validate_project.py --relax --report "$GITHUB_STEP_SUMMARY"
            flutter pub get
          fi
          python3 tools/validate_project.py --post --report "$GITHUB_STEP_SUMMARY"

      # Auditoría automática: falla si algún paquete resuelto trae texto de licencia GPL/AGPL/LGPL.
      - name: Auditoría de licencias
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          cfg = json.load(open('.dart_tool/package_config.json'))
          copyleft = re.compile(r'GNU\s+(AFFERO\s+|LESSER\s+|LIBRARY\s+)?GENERAL\s+PUBLIC\s+LICENSE|\bAGPL\b|\bLGPL\b', re.I)
          lic_names = ('LICENSE', 'LICENSE.md', 'LICENSE.txt', 'COPYING')
          def kind(t):
              if 'Apache License' in t: return 'Apache-2.0'
              if 'Permission is hereby granted, free of charge' in t: return 'MIT'
              if 'Redistribution and use in source and binary forms' in t:
                  return 'BSD-3-Clause' if re.search(r'Neither the name|may be used to endorse', t) else 'BSD-2-Clause'
              return 'DESCONOCIDA'
          bad, rows = [], []
          for p in sorted(cfg['packages'], key=lambda x: x['name']):
              if p['name'] in ('universal', 'webscout_universal'): continue
              path = p['rootUri'][7:] if p['rootUri'].startswith('file://') else os.path.normpath(os.path.join('.dart_tool', p['rootUri']))
              text = ''
              for n in lic_names:
                  f = os.path.join(path, n)
                  if os.path.exists(f):
                      text = open(f, errors='ignore').read()
                      break
              k = kind(text) if text else 'SIN ARCHIVO'
              if text and copyleft.search(text):
                  bad.append(p['name'])
                  k = 'COPYLEFT'
              rows.append((p['name'], k))
          for n, k in rows:
              print(f'{n:40s} {k}')
          if bad:
              print('::error::Licencias copyleft detectadas: ' + ', '.join(bad))
              sys.exit(1)
          print('OK: ningún paquete copyleft.')
          PY

      # 4) Firma release fija
      - name: Preparar firma (keystore temporal + key.properties)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          JKS="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$JKS"
          test -s "$JKS"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$JKS" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          echo "Firma release configurada."

      - name: Aviso - compilando SIN keystore
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::No existe el secret KEYSTORE_BASE64. Se firmará con la clave debug: ese APK NO podrá actualizar una instalación firmada con tu keystore real. Ejecuta este workflow con accion=generar_keystore y crea los 4 secrets."

      - name: Analizar (informativo)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Corregir Set constante duplicado en lib/main.dart
        run: |
          python3 - <<'PY'
          import os, re
          path = 'lib/main.dart'
          if os.path.exists(path):
              src = open(path, 'r', encoding='utf-8').read()
              def dedup_const_set(match):
                  prefix = match.group(1)
                  body = match.group(2)
                  items = re.findall(r"('[^']*'|\"[^\"]*\")", body)
                  seen = set()
                  unique = []
                  for it in items:
                      if it not in seen:
                          seen.add(it)
                          unique.append(it)
                  return f"{prefix}\n  {', '.join(unique)},\n}}"
              new_src, count = re.subn(
                  r"(static\s+const\s+Set<String>\s+_stop\s*=\s*\{)(.*?)(\};)",
                  dedup_const_set,
                  src,
                  flags=re.S,
              )
              if count > 0 and new_src != src:
                  open(path, 'w', encoding='utf-8').write(new_src)
                  print(f"Eliminados duplicados en _stop ({count} bloque(s) actualizado(s)).")
              else:
                  print("No se requirieron cambios en _stop.")
          PY

      # 5) Compilación con reintento: si falla, aplica el respaldo de Gradle y vuelve a compilar.
      #    El Galaxy A06 es arm64-v8a.
      - name: Compilar APK release (ofuscado, arm64)
        run: |
          build() {
            flutter build apk --release \
              --obfuscate \
              --split-debug-info=build/app/outputs/symbols \
              --target-platform android-arm64
          }
          if ! build; then
            echo "::warning::El primer intento falló; se aplica el respaldo de Gradle y se reintenta una vez."
            python3 tools/validate_project.py --gradle-fallback --report "$GITHUB_STEP_SUMMARY"
            build
          fi

      - name: Mostrar huella del certificado de firma
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          echo "La huella SHA-256 debe ser IGUAL en todos los builds para poder actualizar encima."

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: WebScout-Universal-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Subir símbolos de ofuscación
        uses: actions/upload-artifact@v4
        with:
          name: WebScout-symbols
          path: build/app/outputs/symbols
          if-no-files-found: ignore
          retention-days: 30

      - name: Subir informe de validación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WebScout-validation-report
          path: build/validation-report.md
          if-no-files-found: ignore
          retention-days: 14

      # Borra siempre el .jks temporal y key.properties, incluso si el build falló.
      - name: Limpiar keystore temporal
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks" android/key.properties
          echo "Keystore temporal eliminado."

  # =====================================================================
  keystore:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.accion == 'generar_keystore'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SEGURIDAD: úsalo solo en un repositorio PRIVADO (los artifacts los descarga quien pueda leer el repo).
      # Guarda el .jks en un lugar seguro: si lo pierdes no podrás actualizar encima de las instalaciones.
      - name: Generar keystore y Base64
        env:
          ALIAS: ${{ github.event.inputs.key_alias }}
          DAYS: ${{ github.event.inputs.validity_days }}
        run: |
          set -euo pipefail
          [[ "$ALIAS" =~ ^[A-Za-z0-9_-]{2,32}$ ]] || { echo "::error::Alias inválido"; exit 1; }
          [[ "$DAYS" =~ ^[0-9]{3,6}$ ]] || { echo "::error::Validez inválida"; exit 1; }
          mkdir -p out
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -noprompt \
            -keystore out/webscout-release.jks -storetype PKCS12 \
            -storepass "$PASS" -keypass "$PASS" \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity "$DAYS" \
            -dname "CN=WebScout Universal, OU=Mobile, O=WebScout, C=MX"
          base64 -w0 out/webscout-release.jks > out/KEYSTORE_BASE64.txt
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$PASS"
          } > out/SECRETS_PARA_GITHUB.txt
          keytool -list -keystore out/webscout-release.jks -storepass "$PASS" | grep -E "Alias|SHA-256|SHA256" || true

      - name: Subir como artifact temporal (1 día)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-temporal
          path: out/
          retention-days: 1
          if-no-files-found: error

      - name: Instrucciones
        run: |
          echo "1) Descarga el artifact 'keystore-temporal' y ábrelo."
          echo "2) Crea 4 secrets en Settings -> Secrets and variables -> Actions:"
          echo "   KEYSTORE_BASE64 = contenido de KEYSTORE_BASE64.txt"
          echo "   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD = valores de SECRETS_PARA_GITHUB.txt"
          echo "3) Guarda webscout-release.jks en un lugar seguro y borra el artifact."
