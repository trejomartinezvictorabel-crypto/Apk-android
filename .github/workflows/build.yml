name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Localizar raiz de Gradle con Python
        run: |
          python3 -c '
          import os
          root = os.getcwd()
          found = None
          for dirpath, dirnames, filenames in os.walk(root):
              dirnames[:] = [d for d in dirnames if not d.startswith(".") and d not in {"build", ".gradle"}]
              if any(m in filenames for m in ("settings.gradle", "settings.gradle.kts")) or (
                  any(m in filenames for m in ("build.gradle", "build.gradle.kts")) and os.path.isdir(os.path.join(dirpath, "app"))
              ):
                  found = dirpath
                  break
          if not found:
              raise SystemExit("No se encontro ningun proyecto Gradle en el repositorio.")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"GRADLE_DIR={found}\n")
          print(f"Proyecto Gradle detectado en: {found}")
          '

      # Firma persistente: 1) Secret  2) cache  3) generar nueva
      - name: Restaurar keystore desde cache (respaldo)
        id: kscache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/cifracaja-release.jks
            ${{ runner.temp }}/cifracaja-release.pass
          key: cifracaja-keystore-v1
      - name: Preparar firma
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/cifracaja-release.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASS:-$KS_PASS}" >> "$GITHUB_ENV"
            echo "Firma: usando GitHub Secrets."
          else
            if [ ! -f "$KS" ]; then
              P=$(openssl rand -hex 24)
              keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 -alias cifracaja \
                -keyalg RSA -keysize 4096 -validity 36500 -storepass "$P" -keypass "$P" \
                -dname "CN=CifraCaja, O=CifraCaja, C=MX" >/dev/null 2>&1
              echo "$P" > "$RUNNER_TEMP/cifracaja-release.pass"
              echo "::warning::Keystore NUEVO generado. Para firmar siempre igual, guarda KEYSTORE_BASE64, KEYSTORE_PASSWORD y KEY_ALIAS como Secrets."
            fi
            [ -f "$RUNNER_TEMP/cifracaja-release.pass" ] || { echo "::error::Falta contrasena del keystore en cache"; exit 1; }
            P=$(cat "$RUNNER_TEMP/cifracaja-release.pass")
            echo "KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=cifracaja" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$P" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Descargar modelo de voz incluido (español, Vosk, Apache-2.0)
        run: |
          mkdir -p "$GRADLE_DIR/app/src/main/assets/models"
          F="$GRADLE_DIR/app/src/main/assets/models/vosk-model-small-es-0.42.zip"
          if curl -fL --retry 3 -o "$F" https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip && unzip -tq "$F" >/dev/null; then
            echo "Modelo incluido correctamente."
          else
            rm -f "$F"
            echo "::warning::No se pudo descargar el modelo; el APK se compila sin modelo incluido (se instala desde la app)."
          fi

      - name: Pruebas criptograficas
        run: gradle -p "$GRADLE_DIR" :app:testDebugUnitTest --no-daemon
      - name: Compilar APK firmado
        run: gradle -p "$GRADLE_DIR" :app:assembleRelease --no-daemon -PvCode=${{ github.run_number }} -PvName=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: CifraCaja-apk
          path: "**/app/build/outputs/apk/release/*.apk"
